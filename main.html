<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Sanal Sergi - Hedef Listesi</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background:#111; color:#ddd; }
    #info {
      position: absolute; left: 10px; top: 10px; z-index: 10;
      background: rgba(0,0,0,0.6); padding:10px; border-radius:6px; pointer-events: none;
    }
    #info b { color: #ffcc00; }
    #hud {
      position: absolute; right: 10px; top: 10px; z-index: 11;
      background: rgba(0,0,0,0.6); padding:10px; border-radius:6px; text-align:right;
      min-width:180px; font-size: 18px; color: #fff;
    }
    #message {
      position: absolute; left:50%; top:30%; transform: translateX(-50%); z-index: 20;
      background: rgba(0,0,0,0.9); color: #fff; padding:20px 30px; border-radius:10px; display:none;
      font-size:24px; text-align: center; border: 2px solid #555;
    }
    #crosshair {
      position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
      background: rgba(255, 255, 255, 0.4); border-radius: 50%;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    .target-hint { color: #ff3333; font-weight: bold; font-size: 14px; margin-top: 5px; }
    #settingsBtn {
      position: absolute; top: 10px; right: 10px; z-index: 15;
      background: rgba(0,0,0,0.8); color: #fff; border: 2px solid #666;
      padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 14px;
      transition: all 0.2s;
    }
    #settingsBtn:hover { background: rgba(100,100,100,0.8); border-color: #999; }
    #settingsPanel {
      position: absolute; top: 60px; right: 10px; z-index: 25;
      background: rgba(0,0,0,0.95); border: 2px solid #666; padding: 20px; border-radius: 8px;
      min-width: 250px; display: none; color: #ddd;
    }
    .setting-item {
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #444;
    }
    .setting-item:last-child { border-bottom: none; }
    .setting-label {
      font-weight: bold; margin-bottom: 5px; color: #ffcc00;
    }
    input[type="range"] {
      width: 100%; cursor: pointer;
    }
    .toggle-btn {
      background: rgba(100,100,100,0.8); color: #fff; border: 1px solid #666;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;
      transition: all 0.2s;
    }
    .toggle-btn.active { background: #00aa00; border-color: #00ff00; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }
    #timer { font-weight: bold; font-size: 20px; }
  </style>
</head>
<body>
  <div id="info">
    <div><b>Tıkla</b> ve fareyi kilitle.</div>
    <div><b>W/A/S/D</b> = Hareket, <b>E</b> = Çal</div>
    <div class="target-hint">GÖREV: Sadece KIRMIZI ÇERÇEVELİ tabloları çal!</div>
  </div>
  <div id="crosshair"></div>
  <div id="hud">
    <div>Kalan Hedef: <span id="count" style="color:#ff3333">5</span></div>
    <div style="margin-top: 8px;">Süre: <span id="timer" style="color:#ffcc00">02:00</span></div>
  </div>
  <div id="message"></div>
  <button id="settingsBtn">⚙ Ayarlar</button>
  <div id="settingsPanel">
    <div style="margin-bottom: 15px; font-weight: bold; color: #ffcc00;">AYARLAR</div>
    <div class="setting-item">
      <div class="setting-label">Mouse Hassasiyeti</div>
      <input type="range" id="mouseSens" min="0.1" max="3" step="0.1" value="1">
      <div style="font-size: 12px; color: #999; margin-top: 3px;"><span id="sensValue">1.0</span>x</div>
    </div>
    <div class="setting-item">
      <div class="setting-label">Müzik</div>
      <button id="musicToggle" class="toggle-btn active">🔊 AÇIK</button>
    </div>
    <div class="setting-item">
      <div class="setting-label">Müzik Seviyesi</div>
      <input type="range" id="musicVolume" min="0" max="100" step="5" value="30">
      <div style="font-size: 12px; color: #999; margin-top: 3px;"><span id="volumeValue">30</span>%</div>
    </div>
  </div>
  <audio id="bgMusic" loop autoplay>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/PointerLockControls.js"></script>

  <script>
  // --- Temel Ayarlar ---
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1a);
  scene.fog = new THREE.Fog(0x1a1a1a, 15, 50); 

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 1.6, -12); 

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const pointerControls = new THREE.PointerLockControls(camera, document.body);
  const infoDiv = document.getElementById('info');
  
  // --- Ayarlar Sistemi ---
  let mouseSensitivity = 1.0;
  let musicEnabled = true;
  const bgMusic = document.getElementById('bgMusic');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const mouseSensSlider = document.getElementById('mouseSens');
  const sensValue = document.getElementById('sensValue');
  const musicToggle = document.getElementById('musicToggle');
  const musicVolumeSlider = document.getElementById('musicVolume');
  const volumeValue = document.getElementById('volumeValue');
  
  settingsBtn.addEventListener('click', () => {
    settingsPanel.style.display = settingsPanel.style.display === 'none' ? 'block' : 'none';
  });
  
  mouseSensSlider.addEventListener('input', (e) => {
    mouseSensitivity = parseFloat(e.target.value);
    sensValue.innerText = mouseSensitivity.toFixed(1);
  });
  
  musicToggle.addEventListener('click', () => {
    musicEnabled = !musicEnabled;
    if(musicEnabled) {
      bgMusic.play();
      musicToggle.innerText = '🔊 AÇIK';
      musicToggle.classList.add('active');
    } else {
      bgMusic.pause();
      musicToggle.innerText = '🔇 KAPALI';
      musicToggle.classList.remove('active');
    }
  });
  
  musicVolumeSlider.addEventListener('input', (e) => {
    bgMusic.volume = parseFloat(e.target.value) / 100;
    volumeValue.innerText = e.target.value;
  });
  
  // Müziği başlat
  bgMusic.volume = 0.3;
  let musicStarted = false;
  
  // İlk user interaction sonrası müzik başlat
  function startMusicOnInteraction() {
    if (!musicStarted && musicEnabled) {
      bgMusic.play().then(() => {
        musicStarted = true;
      }).catch(err => console.log('Müzik çalınamadı'));
    }
    document.removeEventListener('click', startMusicOnInteraction);
    document.removeEventListener('keydown', startMusicOnInteraction);
  }
  
  document.addEventListener('click', startMusicOnInteraction);
  document.addEventListener('keydown', startMusicOnInteraction);
  
  document.body.addEventListener('click', () => { if(!gameEnded) pointerControls.lock(); });
  pointerControls.addEventListener('lock', () => { 
    infoDiv.style.opacity = '0.3'; 
    settingsPanel.style.display = 'none';
  });
  pointerControls.addEventListener('unlock', () => { infoDiv.style.opacity = '1'; });

  const keys = {};
  settingsPanel.addEventListener('click', (e) => e.stopPropagation());
  settingsPanel.addEventListener('keydown', (e) => e.stopPropagation());
  
  window.addEventListener('keydown', (e) => { 
    if(e.key === 'Escape') {
      if(pointerControls.isLocked) pointerControls.unlock();
      settingsPanel.style.display = 'none';
    }
    keys[e.key.toLowerCase()] = true; 
  });
  window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.2);
  scene.add(hemi);

  // --- Harita ve Seviye Sistemi ---
  const corridorLength = 24; const corridorWidth = 4; const corridorHeight = 3.5;
  const wallMat = new THREE.MeshStandardMaterial({ 
    color: 0x808080, 
    side: THREE.DoubleSide,
    fog: true
  });
  const floorMat = new THREE.MeshStandardMaterial({ 
    color: 0x333333, 
    side: THREE.DoubleSide,
    fog: true
  });
  const ceilMat = new THREE.MeshStandardMaterial({ 
    color: 0x111111, 
    side: THREE.DoubleSide,
    fog: true
  });

  let currentLevelIndex = 0;
  let currentLevel = null;
  let levelObjects = []; 
  let guards = [];
  
  // Backdrop - duvarların arkasını kapatmak için
  const backdropGeo = new THREE.BoxGeometry(200, 200, 200);
  const backdropMat = new THREE.MeshBasicMaterial({ 
    color: 0x0a0a0a,
    fog: false,
    side: THREE.BackSide
  });
  const backdrop = new THREE.Mesh(backdropGeo, backdropMat);
  scene.add(backdrop);

  // Seviye Verileri
  const levels = [
    {
      name: "Kare Galeri",
      timeLimit: 60, // 2 dakika
      startPos: {x:0, y:1.6, z:-12},
      segments: [
        {x:0, z:-12, rot: Math.PI/2}, {x:0, z:12, rot: Math.PI/2},
        {x:12, z:0, rot: 0}, {x:-12, z:0, rot: 0}
      ],
      walkable: [
        {x1:-14, x2:14, z1:-14, z2:-10}, 
        {x1:-14, x2:14, z1:10, z2:14},   
        {x1:-14, x2:-10, z1:-14, z2:14}, 
        {x1:10, x2:14, z1:-14, z2:14}    
      ],
      paintings: [
        {count:5, start:{x:-8, z:-13.9}, step:{x:4, z:0}, rot:0, idStart:100},
        {count:5, start:{x:13.9, z:-8}, step:{x:0, z:4}, rot:-Math.PI/2, idStart:200},
        {count:5, start:{x:8, z:13.9}, step:{x:-4, z:0}, rot:Math.PI, idStart:300},
        {count:5, start:{x:-13.9, z:8}, step:{x:0, z:-4}, rot:Math.PI/2, idStart:400}
      ],
      guards: [
        {color: 0xff0000, wpIndex:0, dir:1},
        {color: 0x0044ff, wpIndex:2, dir:-1}
      ],
      waypoints: [
        new THREE.Vector3(-12, 0.9, -12), new THREE.Vector3(12, 0.9, -12),  
        new THREE.Vector3(12, 0.9, 12), new THREE.Vector3(-12, 0.9, 12)
      ]
    },
    {
      name: "H Tipi Koridor",
      timeLimit: 60, // 1 dakika
      startPos: {x:-12, y:1.6, z:0},
      segments: [], // Manuel oluşturulacak
      customBuild: function() {
        // Sol Dikey Koridor - ortada geçiş için boşluk bırak
        createCorridor(-12, 0, 4, 24, 3.5, {gapZ: true, gapStart:-2, gapEnd:2});
        // Sağ Dikey Koridor - ortada geçiş için boşluk bırak  
        createCorridor(12, 0, 4, 24, 3.5, {gapZ: true, gapStart:-2, gapEnd:2});
        // Ortadaki Yatay Bağlantı - iki uçta geçiş için boşluk
        createCorridor(0, 0, 24, 4, 3.5, {gapX: true, gapStart:-12, gapEnd:12, isHorizontal: true});
      },
      walkable: [
        {x1:-14, x2:-10, z1:-12, z2:12}, // Sol dikey
        {x1:10, x2:14, z1:-12, z2:12},   // Sağ dikey
        {x1:-14, x2:14, z1:-2, z2:2}     // Orta yatay (genişletildi)
      ],
      paintings: [
        {count:4, start:{x:-14, z:-10}, step:{x:0, z:5}, rot:Math.PI/2, idStart:500},
        {count:4, start:{x:14, z:-10}, step:{x:0, z:5}, rot:-Math.PI/2, idStart:600},
        {count:2, start:{x:-5, z:2}, step:{x:10, z:0}, rot:Math.PI, idStart:700},
        {count:2, start:{x:-5, z:-2}, step:{x:10, z:0}, rot:0, idStart:800}
      ],
      guards: [
        {color: 0xff0000, wpIndex:0, dir:1}, 
        {color: 0x00ff00, wpIndex:6, dir:1}  
      ],
      waypoints: [
        // H şeklinde tam tur - koridorların içinden geçiyor
        new THREE.Vector3(-12, 0.9, -10), // 0: Sol alt
        new THREE.Vector3(-12, 0.9, 0),   // 1: Sol orta
        new THREE.Vector3(-12, 0.9, 10),  // 2: Sol üst
        new THREE.Vector3(-12, 0.9, 0),   // 3: Sol orta (geri)
        new THREE.Vector3(0, 0.9, 0),     // 4: Tam orta
        new THREE.Vector3(12, 0.9, 0),    // 5: Sağ orta
        new THREE.Vector3(12, 0.9, 10),   // 6: Sağ üst
        new THREE.Vector3(12, 0.9, 0),    // 7: Sağ orta (geri)
        new THREE.Vector3(12, 0.9, -10),  // 8: Sağ alt
        new THREE.Vector3(12, 0.9, 0),    // 9: Sağ orta (geri)
        new THREE.Vector3(0, 0.9, 0),     // 10: Tam orta (geri)
        new THREE.Vector3(-12, 0.9, 0)    // 11: Sol orta (döngü tamamlanıyor)
      ]
    },
    {
      name: "Zikzak Tünel",
      timeLimit: 60, // 1 dakika
      startPos: {x:0, y:1.6, z:20},
      segments: [
        {x:0, z:12, rot: 0},    // Giriş (Dikey 1)
        {x:12, z:0, rot: Math.PI/2},   // Köşe (Yatay 1)
        {x:24, z:-12, rot: 0},  // Orta (Dikey 2)
        {x:12, z:-24, rot: Math.PI/2}, // Köşe (Yatay 2)
        {x:0, z:-36, rot: 0}                   // Çıkış (Dikey 3)
      ],
      walkable: [
        {x1:-2, x2:2, z1:0, z2:24},       // Giriş dikey
        {x1:0, x2:24, z1:-2, z2:2},       // Yatay 1
        {x1:22, x2:26, z1:-24, z2:0},     // Orta dikey
        {x1:0, x2:24, z1:-26, z2:-22},    // Yatay 2
        {x1:-2, x2:2, z1:-48, z2:-24}     // Çıkış dikey
      ],
      paintings: [
        {count:3, start:{x:-2, z:6}, step:{x:0, z:5}, rot:Math.PI/2, idStart:900},
        {count:3, start:{x:5, z:2}, step:{x:6, z:0}, rot:Math.PI, idStart:910},
        {count:3, start:{x:26, z:-6}, step:{x:0, z:-5}, rot:-Math.PI/2, idStart:920},
        {count:3, start:{x:18, z:-26}, step:{x:-6, z:0}, rot:0, idStart:930}
      ],
      guards: [
        {color: 0xff00ff, wpIndex:0, dir:1},
        {color: 0x00ffff, wpIndex:2, dir:-1}
      ],
      waypoints: [
        new THREE.Vector3(0, 0.9, 18),     // 0: Giriş
        new THREE.Vector3(0, 0.9, 0),      // 1: Giriş-Yatay 1 geçişi
        new THREE.Vector3(24, 0.9, 0),     // 2: Yatay 1 sonu
        new THREE.Vector3(24, 0.9, -24),   // 3: Orta dikey
        new THREE.Vector3(0, 0.9, -24),    // 4: Yatay 2 sonu
        new THREE.Vector3(0, 0.9, -42)     // 5: Çıkış
      ]
    },
    {
      name: "Büyük Salon",
      timeLimit: 60, // 1 dakika
      startPos: {x:0, y:1.6, z:18},
      segments: [
        {x:0, z:0, rot: 0, w:40, l:40, h:6} // 40x40 Büyük Oda
      ],
      walkable: [
        {x1:-19, x2:19, z1:-19, z2:19}
      ],
      blocks: [ // Sütunlar
        {x:-10, z:-10, w:4, l:4}, {x:10, z:-10, w:4, l:4},
        {x:-10, z:10, w:4, l:4}, {x:10, z:10, w:4, l:4},
        {x:0, z:0, w:8, l:8} // Merkez Blok
      ],
      paintings: [
        {count:5, start:{x:-19, z:-10}, step:{x:0, z:5}, rot:Math.PI/2, idStart:1000},
        {count:5, start:{x:19, z:-10}, step:{x:0, z:5}, rot:-Math.PI/2, idStart:1010},
        {count:5, start:{x:-10, z:19}, step:{x:5, z:0}, rot:Math.PI, idStart:1020},
        {count:5, start:{x:-10, z:-19}, step:{x:5, z:0}, rot:0, idStart:1030},
        // Blok üstü tablolar
        {count:1, start:{x:0, z:4.1}, step:{x:0, z:0}, rot:Math.PI, idStart:1040},
        {count:1, start:{x:0, z:-4.1}, step:{x:0, z:0}, rot:0, idStart:1041}
      ],
      guards: [
        {color: 0xffff00, wpIndex:0, dir:1},
        {color: 0xffaa00, wpIndex:2, dir:1},
        {color: 0xff0000, wpIndex:1, dir:-1}
      ],
      waypoints: [
        // Dış kare - saat yönünde
        new THREE.Vector3(-15, 0.9, -15), // 0: Sol alt
        new THREE.Vector3(15, 0.9, -15),  // 1: Sağ alt
        new THREE.Vector3(15, 0.9, 15),   // 2: Sağ üst
        new THREE.Vector3(-15, 0.9, 15)   // 3: Sol üst
      ]
    }
  ];

  function checkCollision(x, z) {
    if(!currentLevel) return true;
    const r = 0.5; // Oyuncu yarıçapı (Duvar içinden geçmeyi engeller)
    
    // 1. Yürünebilir alan kontrolü
    let inWalkable = false;
    for(let w of currentLevel.walkable) {
      if(x >= w.x1 + r && x <= w.x2 - r && z >= w.z1 + r && z <= w.z2 - r) {
        inWalkable = true;
        break;
      }
    }
    if(!inWalkable) return true;

    // 2. Blok (Sütun) kontrolü
    if(currentLevel.blocks) {
      for(let b of currentLevel.blocks) {
        // Blok sınırları (yarıçap eklenmiş)
        const bx1 = b.x - b.w/2 - r;
        const bx2 = b.x + b.w/2 + r;
        const bz1 = b.z - b.l/2 - r;
        const bz2 = b.z + b.l/2 + r;
        
        if(x > bx1 && x < bx2 && z > bz1 && z < bz2) return true; // Bloğa çarptı
      }
    }

    return false; 
  }

  function createSegment(x, z, rotY, opts={}) {
    const w = opts.w || corridorWidth;
    const l = opts.l || corridorLength;
    const h = opts.h || corridorHeight;

    const group = new THREE.Group();
    group.position.set(x, 0, z); group.rotation.y = rotY;
    
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; group.add(floor);
    
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilMat);
    ceil.rotation.x = Math.PI / 2; ceil.position.y = h; 
    ceil.userData = { isCeiling: true };
    group.add(ceil);
    
    if(!opts.noLeft) {
      const leftW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      leftW.position.set(-w/2, h/2, 0); leftW.rotation.y = Math.PI / 2; 
      // Arka duvar - kameraların arkasında görünmesin diye
      const leftWBack = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      leftWBack.position.set(-w/2, h/2, 0); leftWBack.rotation.y = -Math.PI / 2; 
      group.add(leftW);
      group.add(leftWBack);
    }
    if(!opts.noRight) {
      const rightW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      rightW.position.set(w/2, h/2, 0); rightW.rotation.y = -Math.PI / 2; 
      // Arka duvar
      const rightWBack = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
      rightWBack.position.set(w/2, h/2, 0); rightWBack.rotation.y = Math.PI / 2; 
      group.add(rightW);
      group.add(rightWBack);
    }
    
    // Ön ve Arka Duvarlar - Dar tüneller için (noLeft veya noRight true ise)
    if(opts.noLeft || opts.noRight) {
      const frontW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      frontW.position.set(0, h/2, -l/2); group.add(frontW);
      const frontWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      frontWBack.position.set(0, h/2, -l/2 - 0.01); frontWBack.rotation.y = Math.PI; group.add(frontWBack);
      
      const backW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      backW.position.set(0, h/2, l/2); backW.rotation.y = Math.PI; group.add(backW);
      const backWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      backWBack.position.set(0, h/2, l/2 + 0.01); group.add(backWBack);
    }

    scene.add(group);
    levelObjects.push(group);
  }

  // H tipi koridor için özel koridor oluşturma (geçiş boşluklu)
  function createCorridor(x, z, w, l, h, opts={}) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    
    // Zemin
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; group.add(floor);
    
    // Tavan
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilMat);
    ceil.rotation.x = Math.PI / 2; ceil.position.y = h; 
    ceil.userData = { isCeiling: true };
    group.add(ceil);

    if(opts.isHorizontal) {
      // Yatay koridor - Ön ve Arka duvarlar (Z ekseninde)
      const frontW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      frontW.position.set(0, h/2, -l/2); group.add(frontW);
      
      const backW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      backW.position.set(0, h/2, l/2); backW.rotation.y = Math.PI; group.add(backW);
      
      // Arka duvarlar (Double-side için)
      const frontWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      frontWBack.position.set(0, h/2, -l/2); frontWBack.rotation.y = Math.PI; group.add(frontWBack);
      
      const backWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      backWBack.position.set(0, h/2, l/2); group.add(backWBack);
    } else {
      // Dikey koridor
      // Sol Duvar - 2 parça (ortada boşluk)
      if(opts.gapZ) {
        // Üst parça
        const leftW1 = new THREE.Mesh(new THREE.PlaneGeometry(l/2 - 2, h), wallMat);
        leftW1.position.set(-w/2, h/2, -l/4 - 1); leftW1.rotation.y = Math.PI / 2; group.add(leftW1);
        // Alt parça
        const leftW2 = new THREE.Mesh(new THREE.PlaneGeometry(l/2 - 2, h), wallMat);
        leftW2.position.set(-w/2, h/2, l/4 + 1); leftW2.rotation.y = Math.PI / 2; group.add(leftW2);
        
        // Sağ Duvar - 2 parça
        const rightW1 = new THREE.Mesh(new THREE.PlaneGeometry(l/2 - 2, h), wallMat);
        rightW1.position.set(w/2, h/2, -l/4 - 1); rightW1.rotation.y = -Math.PI / 2; group.add(rightW1);
        const rightW2 = new THREE.Mesh(new THREE.PlaneGeometry(l/2 - 2, h), wallMat);
        rightW2.position.set(w/2, h/2, l/4 + 1); rightW2.rotation.y = -Math.PI / 2; group.add(rightW2);
      } else {
        const leftW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
        leftW.position.set(-w/2, h/2, 0); leftW.rotation.y = Math.PI / 2; group.add(leftW);
        const rightW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
        rightW.position.set(w/2, h/2, 0); rightW.rotation.y = -Math.PI / 2; group.add(rightW);
      }
      
      // Ön ve Arka Duvarlar (uçlar)
      const frontW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      frontW.position.set(0, h/2, -l/2); group.add(frontW);
      const backW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
      backW.position.set(0, h/2, l/2); backW.rotation.y = Math.PI; group.add(backW);
    }

    scene.add(group);
    levelObjects.push(group);
  }

  // Kapalı oda oluşturma fonksiyonu (4 duvar + zemin + tavan)
  function createRoom(x, z, w, l, h) {
    const group = new THREE.Group();
    group.position.set(x, 0, z);
    
    // Zemin
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, l), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; group.add(floor);
    
    // Tavan
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, l), ceilMat);
    ceil.rotation.x = Math.PI / 2; ceil.position.y = h; 
    ceil.userData = { isCeiling: true };
    group.add(ceil);
    
    // Sol Duvar
    const leftW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
    leftW.position.set(-w/2, h/2, 0); leftW.rotation.y = Math.PI / 2; group.add(leftW);
    const leftWBack = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
    leftWBack.position.set(-w/2, h/2, 0); leftWBack.rotation.y = -Math.PI / 2; group.add(leftWBack);
    
    // Sağ Duvar
    const rightW = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
    rightW.position.set(w/2, h/2, 0); rightW.rotation.y = -Math.PI / 2; group.add(rightW);
    const rightWBack = new THREE.Mesh(new THREE.PlaneGeometry(l, h), wallMat);
    rightWBack.position.set(w/2, h/2, 0); rightWBack.rotation.y = Math.PI / 2; group.add(rightWBack);
    
    // Ön Duvar
    const frontW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    frontW.position.set(0, h/2, -l/2); group.add(frontW);
    const frontWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    frontWBack.position.set(0, h/2, -l/2); frontWBack.rotation.y = Math.PI; group.add(frontWBack);
    
    // Arka Duvar
    const backW = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    backW.position.set(0, h/2, l/2); backW.rotation.y = Math.PI; group.add(backW);
    const backWBack = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
    backWBack.position.set(0, h/2, l/2); group.add(backWBack);

    scene.add(group);
    levelObjects.push(group);
  }

  function createBlock(b) {
    const geo = new THREE.BoxGeometry(b.w, 4, b.l);
    const mesh = new THREE.Mesh(geo, wallMat);
    mesh.position.set(b.x, 2, b.z);
    scene.add(mesh);
    levelObjects.push(mesh);
  }

  // --- Tablolar ve Hedef Sistemi ---
  const loader = new THREE.TextureLoader();
  let allPaintings = []; 

  function addPainting(x, z, rotY, id) {
    const group = new THREE.Group();
    group.position.set(x, 2, z);
    group.rotation.y = rotY;

    // Önce çerçeveyi ekle (arkada)
    const frameGeo = new THREE.BoxGeometry(1.7, 2.2, 0.15);
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x333333 }); 
    const frame = new THREE.Mesh(frameGeo, frameMat);
    frame.position.z = 0.02; 
    group.add(frame);

    // Sonra resmi ekle (önde)
    const tex = loader.load(`https://picsum.photos/200/300?random=${id}`);
    const mat = new THREE.MeshStandardMaterial({ map: tex });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2), mat);
    mesh.position.z = 0.1;
    group.add(mesh);

    const light = new THREE.PointLight(0xffaa00, 0.3, 5);
    light.position.set(0, 1, 1);
    group.add(light);

    group.userData = { id: id, isTarget: false, frameMesh: frame };
    scene.add(group);
    allPaintings.push(group);
    levelObjects.push(group);
  }

  function loadLevel(index) {
    levelObjects.forEach(obj => scene.remove(obj));
    levelObjects = [];
    allPaintings = [];
    guards = [];
    
    currentLevelIndex = index;
    currentLevel = levels[index];
    
    currentLevel.segments.forEach(s => createSegment(s.x, s.z, s.rot, s));
    
    // Özel inşa fonksiyonu varsa çalıştır
    if(currentLevel.customBuild) {
      currentLevel.customBuild();
    }
    
    if(currentLevel.blocks) {
      currentLevel.blocks.forEach(b => createBlock(b));
    }
    
    currentLevel.paintings.forEach(p => {
      for(let i=0; i<p.count; i++) {
        addPainting(
          p.start.x + i*p.step.x, 
          p.start.z + i*p.step.z, 
          p.rot, 
          p.idStart + i
        );
      }
    });
    
    currentLevel.guards.forEach(g => {
      guards.push(new Guard(g.color, g.wpIndex, g.dir, currentLevel.waypoints));
    });
    
    camera.position.copy(currentLevel.startPos);
    camera.rotation.set(0,0,0);
    
    assignRandomTargets();
    showMessage(currentLevel.name + " Başladı! (Süre: " + formatTime(currentLevel.timeLimit) + ")", 2500);
    startTimer();
  }

  // --- Hedef Atama Fonksiyonu (Rastgele 5) ---
  function assignRandomTargets() {
    allPaintings.forEach(p => {
      p.userData.isTarget = false;
      p.userData.frameMesh.material = new THREE.MeshStandardMaterial({ color: 0x333333 });
      p.visible = true; 
    });

    const indices = [];
    while(indices.length < 5 && indices.length < allPaintings.length) {
      const r = Math.floor(Math.random() * allPaintings.length);
      if(indices.indexOf(r) === -1) indices.push(r);
    }

    indices.forEach(idx => {
      const p = allPaintings[idx];
      p.userData.isTarget = true;
      p.userData.frameMesh.material = new THREE.MeshStandardMaterial({ 
        color: 0xff0000, 
        emissive: 0xff0000,
        emissiveIntensity: 0.5
      });
    });
  }

  // --- GÜVENLİK SİSTEMİ (Paranoyak Modu) ---
  class Guard {
    constructor(color, startWpIndex, startDir, waypointsRef) {
      this.waypoints = waypointsRef;
      const geo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
      const mat = new THREE.MeshStandardMaterial({ color: color });
      this.mesh = new THREE.Mesh(geo, mat);
      this.mesh.position.copy(this.waypoints[startWpIndex]);
      
      this.spot = new THREE.SpotLight(0xffffff, 1, 18, Math.PI/5, 0.5);
      this.spot.position.set(0, 0.5, 0.5); this.spot.target.position.set(0, 0.5, 5);
      this.mesh.add(this.spot); this.mesh.add(this.spot.target);
      scene.add(this.mesh);
      levelObjects.push(this.mesh);

      this.currentWpIndex = startWpIndex;
      this.direction = startDir;
      this.state = 'WALKING';
      this.scanTimer = 0;
      this.baseSpeed = 0.06;
      this.currentSpeed = 0.06;
    }

    update() {
      if (this.state === 'WALKING') this.walk();
      else if (this.state === 'SCANNING') this.scan();
    }

    walk() {
      let nextIndex = (this.currentWpIndex + this.direction);
      if (nextIndex >= this.waypoints.length) nextIndex = 0; 
      if (nextIndex < 0) nextIndex = this.waypoints.length - 1;
      
      const target = this.waypoints[nextIndex];
      const dirVec = new THREE.Vector3().subVectors(target, this.mesh.position);
      if (dirVec.length() < 0.2) {
        this.currentWpIndex = nextIndex;
        this.makeDecision();
      } else {
        dirVec.normalize();
        const wobble = 1 + Math.sin(Date.now() * 0.005) * 0.2; 
        this.mesh.position.add(dirVec.multiplyScalar(this.currentSpeed * wobble));
        this.mesh.lookAt(target);
      }
    }

    scan() {
      this.mesh.rotation.y += 0.05;
      this.scanTimer--;
      if (this.scanTimer <= 0) {
        this.state = 'WALKING';
        this.currentSpeed = this.baseSpeed * 1.5; 
        setTimeout(() => { this.currentSpeed = this.baseSpeed; }, 2000);
      }
    }

    makeDecision() {
      const roll = Math.random();
      if (roll < 0.3) { this.state = 'SCANNING'; this.scanTimer = 60 + Math.random() * 60; }
      else if (roll < 0.5) { this.direction *= -1; }
    }
  }

  // --- Oyun Mantığı ---
  let stolenCount = 0;
  const targetTotal = 5;
  let gameEnded = false;
  let levelComplete = false;
  const msgEl = document.getElementById('message');
  const countEl = document.getElementById('count');
  const timerEl = document.getElementById('timer');
  
  // --- Zamanlayıcı Sistemi ---
  let timeRemaining = 120;
  let timerInterval = null;
  
  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
  }
  
  function updateTimerDisplay() {
    timerEl.innerText = formatTime(timeRemaining);
    if(timeRemaining <= 30) {
      timerEl.style.color = '#ff3333';
      timerEl.style.animation = 'pulse 0.5s infinite';
    } else if(timeRemaining <= 60) {
      timerEl.style.color = '#ff9900';
      timerEl.style.animation = 'none';
    } else {
      timerEl.style.color = '#ffcc00';
      timerEl.style.animation = 'none';
    }
  }
  
  function startTimer() {
    if(timerInterval) clearInterval(timerInterval);
    timeRemaining = currentLevel.timeLimit;
    updateTimerDisplay();
    
    timerInterval = setInterval(() => {
      if(gameEnded) return;
      timeRemaining--;
      updateTimerDisplay();
      
      if(timeRemaining <= 0) {
        clearInterval(timerInterval);
        gameOver(false, true); // Süre doldu
      }
    }, 1000);
  }
  
  function stopTimer() {
    if(timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // Oyunu Başlat
  loadLevel(0);

  window.addEventListener('keydown', (e) => {
    if(e.key.toLowerCase() === 'e') trySteal();
    if(e.key.toLowerCase() === 'r' && gameEnded) {
      gameEnded = false;
      stolenCount = 0;
      countEl.innerText = 5;
      msgEl.style.display = 'none';
      
      if(levelComplete) {
        if(currentLevelIndex < levels.length - 1) {
           loadLevel(currentLevelIndex + 1);
        } else {
           loadLevel(0); 
        }
      } else {
        loadLevel(currentLevelIndex);
      }
      pointerControls.lock();
    }
  });

  function trySteal() {
    if(gameEnded) return;
    let nearest = null; let minDist = 2.5;
    
    allPaintings.forEach(p => {
      if(!p.visible) return;
      const dist = p.position.distanceTo(camera.position);
      if(dist < minDist) { minDist = dist; nearest = p; }
    });

    if(!nearest) { showMessage("Burada tablo yok!", 1000); return; }

    if(nearest.userData.isTarget === false) {
      showMessage("Bu tablo listede yok! Sadece Kırmızıları Çal!", 1500, "red");
      return;
    }

    let caught = false;
    guards.forEach(g => {
      const dist = g.mesh.position.distanceTo(camera.position);
      if(dist < 9) {
        // Görüş açısı kontrolü - guard oyuncuyu görüyor mu?
        const guardForward = new THREE.Vector3(0, 0, 1);
        guardForward.applyQuaternion(g.mesh.quaternion);
        
        const toPlayer = new THREE.Vector3();
        toPlayer.subVectors(camera.position, g.mesh.position).normalize();
        
        const angle = guardForward.angleTo(toPlayer);
        // Guard'ın görüş açısı ~120 derece (PI/3 radyan her iki tarafta)
        if(angle < Math.PI / 2.5) {
          caught = true;
        }
      }
    });

    if(caught) { gameOver(false); return; }

    nearest.visible = false; 
    stolenCount++;
    countEl.innerText = targetTotal - stolenCount;
    showMessage("Hedef Çalındı!", 1500, "lime");

    if(stolenCount >= targetTotal) gameOver(true);
  }

  function showMessage(txt, duration, color="white") {
    msgEl.innerText = txt; 
    msgEl.style.color = color;
    msgEl.style.display = 'block';
    if(duration) setTimeout(() => msgEl.style.display = 'none', duration);
  }

  function gameOver(win, timeOut = false) {
    gameEnded = true; 
    levelComplete = win;
    stopTimer();
    pointerControls.unlock(); 
    msgEl.style.display = 'block';
    msgEl.style.color = "white";
    if(win) {
      const bonusTime = timeRemaining;
      if(currentLevelIndex < levels.length - 1) {
        msgEl.innerHTML = "<span style='color:#0f0'>GÖREV TAMAMLANDI!</span><br>Kalan Süre: " + formatTime(bonusTime) + "<br>Sonraki seviyeye geçiliyor...<br><small>Devam etmek için R tuşuna bas.</small>";
      } else {
        msgEl.innerHTML = "<span style='color:#0f0'>OYUN BİTTİ!</span><br>Tüm seviyeleri tamamladın!<br><small>Başa dönmek için R tuşuna bas.</small>";
      }
    }
    else if(timeOut) {
      msgEl.innerHTML = "<span style='color:#f00'>SÜRE DOLDU!</span><br>Daha hızlı olmalısın!<br><small>Tekrar denemek için R tuşuna bas.</small>";
    }
    else msgEl.innerHTML = "<span style='color:#f00'>YAKALANDIN!</span><br>Dikkatli ol.<br><small>Tekrar denemek için R tuşuna bas.</small>";
  }

  function updatePlayerMovement() {
    if(!pointerControls.isLocked) return;
    const speed = 0.12;
    const direction = new THREE.Vector3(); const right = new THREE.Vector3();
    camera.getWorldDirection(direction); direction.y = 0; direction.normalize();
    right.crossVectors(camera.up, direction).normalize();
    
    const nextPos = camera.position.clone();
    if(keys['w']) nextPos.add(direction.clone().multiplyScalar(speed));
    if(keys['s']) nextPos.add(direction.clone().multiplyScalar(-speed));
    if(keys['a']) nextPos.add(right.clone().multiplyScalar(speed));
    if(keys['d']) nextPos.add(right.clone().multiplyScalar(-speed));

    if (!checkCollision(nextPos.x, nextPos.z)) {
      camera.position.x = nextPos.x; camera.position.z = nextPos.z;
    }
  }

  // --- Minimap ---
  const miniCam = new THREE.OrthographicCamera(-18, 18, 18, -18, 1, 100);
  miniCam.position.set(0, 20, 0); miniCam.lookAt(0,0,0);
  const pIcon = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
  pIcon.rotation.x = -Math.PI/2; pIcon.position.y = 5; scene.add(pIcon);
  
  const iconGroup = new THREE.Group();
  scene.add(iconGroup);

  function animate() {
    requestAnimationFrame(animate);
    if(!gameEnded) {
      updatePlayerMovement();
      guards.forEach(g => g.update());
    }
    pIcon.position.x = camera.position.x; pIcon.position.z = camera.position.z;
    
    while(iconGroup.children.length < guards.length) {
       const ic = new THREE.Mesh(new THREE.CircleGeometry(0.6, 16), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
       ic.rotation.x = -Math.PI/2; ic.position.y = 5;
       iconGroup.add(ic);
    }
    while(iconGroup.children.length > guards.length) {
       iconGroup.remove(iconGroup.children[0]);
    }
    
    guards.forEach((g, i) => {
       const ic = iconGroup.children[i];
       ic.position.x = g.mesh.position.x;
       ic.position.z = g.mesh.position.z;
       ic.rotation.z = g.mesh.rotation.y;
       ic.material.color.setHex(g.mesh.material.color.getHex());
    });

    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
    renderer.setScissorTest(false); renderer.clear(); renderer.render(scene, camera);
    
    // Minimap Update
    const mapSize = 200;
    miniCam.position.x = camera.position.x;
    miniCam.position.z = camera.position.z;
    
    // Hide ceilings for minimap
    scene.traverse(obj => {
      if(obj.userData && obj.userData.isCeiling) obj.visible = false;
    });

    renderer.clearDepth(); renderer.setScissorTest(true);
    renderer.setScissor(window.innerWidth - mapSize - 10, window.innerHeight - mapSize - 10, mapSize, mapSize);
    renderer.setViewport(window.innerWidth - mapSize - 10, window.innerHeight - mapSize - 10, mapSize, mapSize);
    renderer.render(scene, miniCam);

    // Show ceilings back
    scene.traverse(obj => {
      if(obj.userData && obj.userData.isCeiling) obj.visible = true;
    });
  }
  animate();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  </script>
</body>
